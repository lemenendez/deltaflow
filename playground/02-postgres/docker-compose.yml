services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: deltaflow
      POSTGRES_USER: deltaflow
      POSTGRES_PASSWORD: deltaflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltaflow -d deltaflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  playground:
    image: golang:1.25
    working_dir: /workspace/playground/02-postgres
    environment:
      DELTAFLOW_PG_DSN: postgres://deltaflow:deltaflow@postgres:5432/deltaflow?sslmode=disable
    volumes:
      - ../../:/workspace
      - gomodcache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
    command: ["go", "run", "."]

volumes:
  pgdata:
  gomodcache:

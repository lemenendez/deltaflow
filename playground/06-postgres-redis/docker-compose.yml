services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: deltaflow
      POSTGRES_USER: deltaflow
      POSTGRES_PASSWORD: deltaflow
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../:/workspace:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deltaflow -d deltaflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-redis:8.0}
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD-SHELL", "(redis-cli ping || valkey-cli ping) | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  playground:
    image: golang:1.25
    working_dir: /workspace/playground/06-postgres-redis
    environment:
      DELTAFLOW_PG_DSN: postgres://deltaflow:deltaflow@postgres:5432/deltaflow?sslmode=disable
      DELTAFLOW_REDIS_ADDR: redis:6379
      DELTAFLOW_REDIS_TTL: ${DELTAFLOW_REDIS_TTL:-5m}
    volumes:
      - ../../:/workspace
      - gomodcache:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["go", "run", "."]

volumes:
  pgdata:
  gomodcache:

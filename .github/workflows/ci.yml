name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Connector Changes
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            integration:
              - 'pkg/connectors/**'
              - 'internal/worker.go'
              - 'internal/store.go'
              - 'internal/dispatcher.go'
              - 'pkg/deltaflow/**'
              - 'integration/**'

  root-tests:
    name: Root Tests
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run root tests
        run: go test ./...

  playground-01-smoke:
    name: Playground 01 Smoke
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: playground/01-in-memory/go.mod

      - name: Test standalone playground module
        working-directory: playground/01-in-memory
        run: go test ./...

      - name: Run standalone playground module
        working-directory: playground/01-in-memory
        run: go run .

  postgres-integration:
    name: Postgres Integration
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.integration == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: integration/go.mod

      - name: Run container-backed integration tests
        working-directory: integration
        env:
          DELTAFLOW_IT_ENABLE: '1'
          DELTAFLOW_IT_DB: postgres
        run: go test -tags=integration ./...

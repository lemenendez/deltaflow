store:
  type: postgres
  dsn: ${DELTAFLOW_STORE_DSN}

# Runtime registrations are application-owned.
# The stock cmd/deltaflow binary supports validate/migrate only;
# run is available from registry-enabled custom binaries.

workers:
  concurrency: 8
  lease_ttl: 30s
  batch_size: 16
  max_attempts: 5

pipelines:
  - name: contacts-to-elasticsearch
    sync_id: contacts-to-elasticsearch
    source:
      type: postgres-outbox
      projection_type: contact
    projector:
      name: contact-projector
    target:
      type: elasticsearch
      index: contacts
    applier:
      mode: upsert